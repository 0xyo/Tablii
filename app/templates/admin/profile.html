{% extends 'admin/base_admin.html' %}
{% block title %}Profile — Admin{% endblock %}

{% block content %}
<header class="admin-page-head" style="max-width:760px; margin-left:auto; margin-right:auto;">
  <div>
    <p class="admin-eyebrow">Account settings</p>
    <h1 class="admin-page-title">Admin Profile</h1>
    <p class="admin-page-copy">Update your platform account details and avatar.</p>
  </div>
</header>

<section class="admin-form-card">
  <form id="profile-form" method="POST" enctype="multipart/form-data" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="admin-profile-head">
      <img
        src="{{ user.avatar_url if user.avatar_url else url_for('static', filename='icons/icon-192.png') }}"
        alt="Admin avatar"
        class="admin-avatar">
      <div class="admin-field" style="flex:1;">
        <label for="avatar">Avatar</label>
        <input
          id="avatar"
          type="file"
          name="avatar"
          accept="image/png,image/jpeg,image/jpg,image/webp">
      </div>
    </div>

    <div class="admin-field">
      <label for="name">Full Name</label>
      <input
        id="name"
        type="text"
        name="name"
        required
        aria-required="true"
        value="{{ (form.name if form else None) or user.name }}">
    </div>

    <div class="admin-field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        required
        aria-required="true"
        value="{{ (form.email if form else None) or user.email }}">
    </div>

    <div class="admin-field">
      <label for="password">New Password</label>
      <input
        id="password"
        type="password"
        name="password"
        minlength="8"
        placeholder="Leave blank to keep current password">
    </div>

    <div class="admin-actions">
      <button id="profile-save-btn" type="submit" class="admin-btn primary">
        <span id="profile-btn-text">Save Changes</span>
      </button>
      <a href="{{ url_for('admin.restaurants') }}" class="admin-btn">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('profile-form').onsubmit = async function(e) {
    e.preventDefault();
    var form = this;
    var submitBtn = document.getElementById('profile-save-btn');
    submitBtn.disabled = true;
    document.getElementById('profile-btn-text').textContent = 'Saving...';

    var response = await fetch(form.action || window.location.href, {
      method: form.method,
      body: new FormData(form)
    });

    if (response.ok) {
      document.getElementById('profile-btn-text').textContent = 'Saved';
      setTimeout(() => { window.location.reload(); }, 450);
    } else {
      document.getElementById('profile-btn-text').textContent = 'Save Changes';
      submitBtn.disabled = false;
      alert('Error saving profile');
    }
  };
</script>
{% endblock %}
