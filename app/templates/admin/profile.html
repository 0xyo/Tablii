{% extends 'admin/base_admin.html' %}
{% block title %}Profile — Admin{% endblock %}

{% block content %}
<div style="max-width:760px; margin:0 auto;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <div>
      <h1 style="font-size:1.5rem; font-weight:700; color:#f5c56a; margin:0 0 4px;">Admin Profile</h1>
      <p style="margin:0; color:#8a7f70; font-size:0.9rem;">Update your platform account details.</p>
    </div>
  </div>

  <div style="background:#1a1814; border:1px solid #2a2826; border-radius:10px; padding:22px;">
    <form id="profile-form" method="POST" enctype="multipart/form-data" style="display:flex; flex-direction:column; gap:14px;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div style="display:flex; align-items:center; gap:14px;">
        <img
          src="{{ user.avatar_url if user.avatar_url else url_for('static', filename='icons/icon-192.png') }}"
          alt="Admin avatar"
          style="width:64px; height:64px; border-radius:999px; object-fit:cover; border:1px solid #2a2826;"
        >
        <div style="flex:1;">
        <label for="avatar" style="display:block; color:#d4c5a9; font-size:0.78rem; margin-bottom:5px; font-weight:600;">Avatar</label>
          <input
            id="avatar"
            type="file"
            name="avatar"
            accept="image/png,image/jpeg,image/jpg,image/webp"
            style="width:100%; background:#0F0D0B; border:1px solid #2a2826; color:#c9b99a; padding:10px; border-radius:6px; outline-color:#f5c56a;"
          >
        </div>
      </div>

      <div>
        <label for="name" style="display:block; color:#d4c5a9; font-size:0.78rem; margin-bottom:5px; font-weight:600;">Full Name <span aria-label="required">*</span></label>
        <input
          id="name"
          type="text"
          name="name"
          required
          aria-required="true"
          value="{{ (form.name if form else None) or user.name }}"
          style="width:100%; background:#0F0D0B; border:1px solid #2a2826; color:#f5e6c8; padding:10px 12px; border-radius:6px; outline-color:#f5c56a;"
        >
      </div>

      <div>
        <label for="email" style="display:block; color:#d4c5a9; font-size:0.78rem; margin-bottom:5px; font-weight:600;">Email <span aria-label="required">*</span></label>
        <input
          id="email"
          type="email"
          name="email"
          required
          aria-required="true"
          value="{{ (form.email if form else None) or user.email }}"
          style="width:100%; background:#0F0D0B; border:1px solid #2a2826; color:#f5e6c8; padding:10px 12px; border-radius:6px; outline-color:#f5c56a;"
        >
      </div>

      <div>
        <label for="password" style="display:block; color:#d4c5a9; font-size:0.78rem; margin-bottom:5px; font-weight:600;">New Password (leave blank to keep current)</label>
        <input
          id="password"
          type="password"
          name="password"
          minlength="8"
          style="width:100%; background:#0F0D0B; border:1px solid #2a2826; color:#f5e6c8; padding:10px 12px; border-radius:6px; outline-color:#f5c56a;"
        >
      </div>

      <div style="display:flex; gap:10px; margin-top:4px;">
        <button id="profile-save-btn" type="submit" style="background:#f5c56a; color:#2a2008; border:none; padding:10px 16px; border-radius:6px; font-weight:700; cursor:pointer; min-height:44px; transition:all 0.2s;"><span id="profile-btn-text">Save Changes</span></button>
        <a href="{{ url_for('admin.restaurants') }}" style="display:inline-flex; align-items:center; border:1px solid #2a2826; color:#c9b99a; text-decoration:none; padding:10px 16px; border-radius:6px; min-height:44px;">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('profile-form').onsubmit = async function(e) {
    e.preventDefault();
    var form = this;
    var submitBtn = document.getElementById('profile-save-btn');
    submitBtn.disabled = true;
    submitBtn.style.opacity = '0.6';
    document.getElementById('profile-btn-text').textContent = 'Saving...';
    
    var formData = new FormData(form);
    var response = await fetch(form.action || window.location.href, {
      method: form.method,
      body: formData
    });
    if (response.ok) {
      document.getElementById('profile-btn-text').textContent = 'Saved ✓';
      setTimeout(() => { window.location.reload(); }, 500);
    } else {
      document.getElementById('profile-btn-text').textContent = 'Save Changes';
      submitBtn.disabled = false;
      submitBtn.style.opacity = '1';
      alert('Error saving profile');
    }
  };
</script>
{% endblock %}
