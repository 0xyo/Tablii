services:
  - type: web
    name: tablii
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      npm install
      npm run build:css
      TABLII_SKIP_BOOTSTRAP=true flask db upgrade
      python seed.py
    startCommand: gunicorn --worker-class gthread --threads 4 -w 1 --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tablii-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TABLII_AUTO_SEED
        value: "true"
      - key: FLOUCI_APP_TOKEN
        sync: false
      - key: FLOUCI_APP_SECRET
        sync: false

databases:
  - name: tablii-db
    plan: free
    databaseName: tablii
    user: tablii_user
